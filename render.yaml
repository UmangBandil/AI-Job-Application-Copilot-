# Render Blueprint — AI Job Application Copilot
# One-click deploy: https://render.com/deploy

services:
  # ── Backend + Frontend (single service) ──────────────────────────
  - type: web
    name: job-copilot
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.production
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobcopilot-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: jobcopilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'
    healthCheckPath: /api/v1/health
    autoDeploy: true

databases:
  # ── PostgreSQL Database ──────────────────────────────────────────
  - name: jobcopilot-db
    plan: free
    databaseName: jobcopilot
    ipAllowList: []
